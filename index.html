<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Estácio — Verificação de Registro</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
:root{
--primary:#005daa;
--accent:#003f73;
--bg:#eef3f9;
--card:#fff;
--border:#e5e7eb;
--text:#111827;
--success:#16a34a;
--done:#2563eb;
}

body{
margin:0;
background:var(--bg);
font-family:system-ui,Arial;
color:var(--text);
}

.header{
background:#fff;
border-bottom:1px solid var(--border);
padding:18px;
text-align:center;
}

.header h1{
margin:0;
color:var(--primary);
}

.container{
max-width:700px;
margin:30px auto;
padding:20px;
}

.card{
background:var(--card);
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,.05);
border:1px solid var(--border);
}

.card-header{
background:var(--primary);
color:#fff;
padding:14px;
font-weight:bold;
}

.card-body{
padding:20px;
}

.search{
display:flex;
gap:10px;
}

input{
flex:1;
padding:12px;
border-radius:6px;
border:1px solid var(--border);
}

button{
background:var(--primary);
color:#fff;
border:none;
padding:12px 16px;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.95;
}

.status{
display:inline-block;
padding:6px 12px;
border-radius:999px;
font-weight:bold;
margin-bottom:15px;
}

.field{
display:grid;
grid-template-columns:180px 1fr;
padding:8px 0;
border-bottom:1px solid #f1f5f9;
}

.label{
color:#6b7280;
font-weight:600;
}

.value{
font-weight:600;
}

.loader{
display:none;
margin-top:10px;
font-weight:bold;
color:var(--primary);
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:.4;}
100%{opacity:1;}
}

#qrcode{
margin-top:15px;
}

@media print{
.search, button, .header{
display:none;
}

.card{
box-shadow:none;
border:2px solid #000;
}
}
</style>
</head>

<body>

<div class="header">
<h1>Portal Acadêmico Estácio</h1>
</div>

<div class="container">
<div class="card">

<div class="card-header">Consulta de Registro</div>

<div class="card-body">

<div class="search">
<input id="codigo" placeholder="Digite o número do registro"/>
<button onclick="verificar()">Consultar</button>
</div>

<div id="loader" class="loader">Consultando base acadêmica...</div>

<div id="resultado" style="display:none; margin-top:20px;">

<div class="status" id="status"></div>

<div class="field"><div class="label">Nome</div><div class="value" id="nome"></div></div>
<div class="field"><div class="label">Curso</div><div class="value" id="curso"></div></div>
<div class="field"><div class="label">Conclusão</div><div class="value" id="conclusao"></div></div>
<div class="field"><div class="label">Polo</div><div class="value" id="polo"></div></div>
<div class="field"><div class="label">Registro</div><div class="value" id="registro"></div></div>
<div class="field"><div class="label">Protocolo</div><div class="value" id="protocolo"></div></div>
<div class="field"><div class="label">Data da Consulta</div><div class="value" id="data"></div></div>

<div id="qrcode"></div>

<br>
<button onclick="window.print()">Imprimir</button>

</div>

</div>
</div>
</div>

<script>

function normalizar(s){
return String(s)
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.toUpperCase()
.replace(/\s+/g,"")
.trim();
}

const registros={

"377643-22":{
nome:"Enedina da Silva Bezerra Neta",
curso:"Bacharel em Educação Física",
conclusao:"13/02/2026",
status:"Ativo",
polo:"Centro Universitário Estácio do Piauí"
},

"36774467-88":{
nome:"Ramon de Carvalho Conceição",
curso:"Bacharel em Engenharia Elétrica",
conclusao:"24/08/2025",
status:"Concluído",
polo:"Centro Universitário Estácio da Bahia — Polo Fratelli Vita (Calçada)"
}

};

function gerarProtocolo(){
const base = Math.random().toString(36).substring(2,6).toUpperCase();
const time = Date.now().toString().slice(-6);
return `EST-${base}-${time}`;
}

function delayRealista(){
return 900 + Math.random()*1400;
}

function validarFormato(codigo){
return /^\d{5,8}-\d{2}$/.test(codigo);
}

function verificar(){

const valor=document.getElementById("codigo").value.trim();
const loader=document.getElementById("loader");
const resultado=document.getElementById("resultado");

if(!valor){
alert("Informe o número do registro.");
return;
}

if(!validarFormato(valor)){
alert("Formato inválido. Use padrão: 000000-00");
return;
}

resultado.style.display="none";
loader.style.display="block";

setTimeout(()=>{

loader.style.display="none";

const chave=Object.keys(registros)
.find(k=>normalizar(k)===normalizar(valor));

if(!chave){
alert("Registro não localizado na base acadêmica.");
return;
}

const r=registros[chave];
const protocolo=gerarProtocolo();
const agora=new Date().toLocaleString("pt-BR");

document.getElementById("nome").innerText=r.nome;
document.getElementById("curso").innerText=r.curso;
document.getElementById("conclusao").innerText=r.conclusao;
document.getElementById("polo").innerText=r.polo;
document.getElementById("registro").innerText=chave;
document.getElementById("protocolo").innerText=protocolo;
document.getElementById("data").innerText=agora;

// STATUS DINÂMICO
const statusEl = document.getElementById("status");

if(r.status === "Ativo"){
statusEl.innerText = "● Registro Ativo";
statusEl.style.background = "#ecfdf5";
statusEl.style.color = "#16a34a";
}else{
statusEl.innerText = "● Registro Concluído";
statusEl.style.background = "#eff6ff";
statusEl.style.color = "#2563eb";
}

document.getElementById("qrcode").innerHTML="";

const payload = JSON.stringify({
registro: chave,
nome: r.nome,
protocolo: protocolo,
data: agora
});

new QRCode(document.getElementById("qrcode"),{
text: payload,
width:120,
height:120
});

resultado.style.display="block";

}, delayRealista());

}

document.getElementById("codigo").addEventListener("keypress",function(e){
if(e.key==="Enter"){
verificar();
}
});

</script>

</body>
</html>
