<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Estácio — Verificação de Registro</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  background:#eef3f9;
  font-family:Arial,sans-serif;
}
.container{
  max-width:700px;
  margin:30px auto;
  padding:20px;
}
.card{
  background:#fff;
  border-radius:10px;
  padding:20px;
}
input{
  padding:10px;
  width:70%;
}
button{
  padding:10px;
  background:#005daa;
  color:#fff;
  border:none;
  cursor:pointer;
}
.field{
  margin:8px 0;
}
.status{
  margin-bottom:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <input id="codigo" placeholder="Digite o registro"/>
    <button onclick="verificar()">Consultar</button>

    <div id="loader" style="display:none;">Consultando...</div>

    <div id="resultado" style="display:none;">
      <div class="status" id="status"></div>

      <div class="field">Nome: <span id="nome"></span></div>
      <div class="field">Formação: <span id="curso"></span></div>
      <div class="field">Conclusão: <span id="conclusao"></span></div>
      <div class="field">Universidade: <span id="universidade"></span></div>
      <div class="field">Polo: <span id="polo"></span></div>
      <div class="field">Registro: <span id="registro"></span></div>

      <div id="qrcode"></div>
    </div>

  </div>
</div>

<script>
const banco = window.supabase.createClient(
  "https://fghkqwxhrdodyhvfrlzz.supabase.co",
  "sb_publishable_cwIQcgCl1O0z_CKo6E8xUQ_Y-VoPyve"
);

function normalizarRegistro(valor){
  return String(valor || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9]/g, "")
    .toUpperCase()
    .trim();
}

async function verificar(){
  const codigo = document.getElementById("codigo").value.trim();
  const codigoNormalizado = normalizarRegistro(codigo);

  const loader = document.getElementById("loader");
  const resultado = document.getElementById("resultado");

  if(!codigo){
    alert("Digite o registro");
    return;
  }

  loader.style.display = "block";
  resultado.style.display = "none";

  try{
    const { data, error } = await banco
      .from("registros")
      .select("*");

    console.log("codigo digitado:", JSON.stringify(codigo));
    console.log("codigo normalizado:", codigoNormalizado);
    console.log("dados recebidos:", data);
    console.log("error:", error);

    loader.style.display = "none";

    if(error){
      alert("Erro: " + error.message);
      return;
    }

    const encontrado = (data || []).find(item =>
      normalizarRegistro(item.registro) === codigoNormalizado
    );

    if(!encontrado){
      alert("Registro não encontrado");
      return;
    }

    document.getElementById("nome").innerText = encontrado.nome || "";
    document.getElementById("curso").innerText = encontrado.curso || "";
    document.getElementById("conclusao").innerText = encontrado.conclusao || "";
    document.getElementById("universidade").innerText = encontrado.universidade || "";
    document.getElementById("polo").innerText = encontrado.polo || "";
    document.getElementById("registro").innerText = encontrado.registro || "";

    const statusEl = document.getElementById("status");
    if((encontrado.status || "").toUpperCase() === "ATIVO"){
      statusEl.innerText = "Registro Ativo";
      statusEl.style.color = "green";
    }else{
      statusEl.innerText = "Registro Concluído";
      statusEl.style.color = "blue";
    }

    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), {
      text: JSON.stringify(encontrado),
      width: 120,
      height: 120
    });

    resultado.style.display = "block";
  }catch(e){
    loader.style.display = "none";
    console.error(e);
    alert("Erro ao conectar com o sistema.");
  }
}
</script>

</body>
</html>
